<!-- Breathing Mandala / Helical Rings with Logo -->
<div class="relative w-64 h-64 flex items-center justify-center mb-space-md"><svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" style="animation: spin 34s linear infinite;" viewbox="0 0 260 260"><circle class="text-tertiary-fixed/60" cx="130" cy="130" r="122" stroke="currentColor" stroke-dasharray="8 12" stroke-linecap="round" stroke-width="1.5"></circle><circle class="text-secondary-fixed/80" cx="130" cy="130" r="108" stroke="currentColor" stroke-dasharray="14 18" stroke-width="1.2"></circle></svg><div class="absolute w-56 h-56 rounded-full bg-gradient-to-tr from-tertiary-fixed/30 via-surface-container-lowest to-secondary-fixed/30 transition-transform duration-[4000ms] ease-in-out scale-100 shadow-xl" id="breathe-halo"></div><div class="absolute w-48 h-48 rounded-full overflow-hidden shadow-lg p-1 bg-surface-container-lowest/90 backdrop-blur-xl flex items-center justify-center"><img alt="Atleta en momento de enfoque consciente y respiración" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCruDEfCXQS9y0gIWrSL5VyFQ0dlKBjqcODJkpDl79fcz1HJESIMw1NPMGGuL9kZR5_rRUof8ZJcfZl9dbWkp3-0UtUJpDfY6W8iGmaoxZiBGuLmetEDEz8liH4WATXfeJcHlc6n0jt8jvLHbAxuDGCKzlS70LlN4w7TazAPLu345dCQblE9oFZMYVJLibK6fBk75TryCIJQL_h047uAWwXnifDlFAI-kTfA8UuQ9xsjQG2aEckhrGkAw"/></div><div class="absolute -bottom-2 right-4 z-20 w-14 h-14 rounded-full bg-surface-container-lowest/95 backdrop-blur-md shadow-md p-1 border border-surface-container-high flex items-center justify-center"><img alt="AKSIS Logo" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD-jLivmLWCNbXhI5430YHkoFngABVQvoj-fMq1RTF0lV0QyRPo8IvWBBtTkzwBNxn1L4fhQ0AHHr_DcTS1v8fBAGWzMx3I7ApjQzy58BOoFUwStfNFDfE6gV2P2jgVNYuCV1MQjEEM4-uwFTSKvaiT8XLNDkVURwUsG4lDF2Tg_376EeoPcERt_3vWpiQjstd_6YwQ1ut0so-NS63NSSzZmHxkiumlHqHLliNB-FoXj61HCs6MflIj0pBBKdq4opghUhQ"/></div><div class="absolute -top-1 right-8 w-2 h-2 rounded-full bg-primary-container shadow-sm animate-bounce" style="animation-duration: 3.5s;"></div><div class="absolute bottom-4 left-6 w-2.5 h-2.5 rounded-full bg-secondary-fixed-dim shadow-sm animate-pulse" style="animation-duration: 4.2s;"></div></div>
<!-- Breathing Micro-guide Prompt -->
<div class="flex items-center gap-2 mb-space-sm bg-surface-container-low/70 backdrop-blur-sm px-3.5 py-1 rounded-full">
<span class="material-symbols-outlined text-sm text-primary-container">spa</span>
<span class="font-label-sm text-label-sm tracking-wider uppercase text-on-surface-variant transition-opacity duration-700" id="breath-text">Inhala calma...</span>
</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-[0.22em] text-on-surface font-light uppercase pl-2">

<p class="font-label-sm text-label-sm uppercase tracking-[0.28em] text-primary font-medium mt-1 mb-space-sm">

<div class="max-w-xs mx-auto">

</div>
<span class="text-outline-variant font-body-sm">•</span>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest/90 shadow-sm">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed-dim"></span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wider uppercase">Emoción</span>
</div>

</div>
</div>
</div>
<script>
  (function initAksisBreathing() {
    const halo = document.getElementById('breathe-halo');
    const label = document.getElementById('breath-text');
    const audioBtn = document.getElementById('breathe-audio-toggle');
    const soundIcon = document.getElementById('sound-icon');
    const startBtn = document.getElementById('start-journey-btn');

    let cycle = 0;
    const states = [
      { text: 'Inhala calma...', scale: 'scale-110' },
      { text: 'Sostén tu centro...', scale: 'scale-105' },
      { text: 'Exhala presencia...', scale: 'scale-95' },
      { text: 'Habita el presente...', scale: 'scale-100' }
    ];

    setInterval(() => {
      cycle = (cycle + 1) % states.length;
      if (halo && label) {
        label.style.opacity = '0';
        setTimeout(() => {
          label.textContent = states[cycle].text;
          label.style.opacity = '1';
        }, 350);

        halo.className = halo.className.replace(/scale-(95|100|105|110)/g, '').trim();
        halo.classList.add(states[cycle].scale);
      }
    }, 4000);

    let soundActive = false;
    if (audioBtn && soundIcon) {
      audioBtn.addEventListener('click', () => {
        soundActive = !soundActive;
        soundIcon.textContent = soundActive ? 'volume_up' : 'air';
        audioBtn.classList.toggle('text-primary', soundActive);
      });
    }

    if (startBtn) {
      startBtn.addEventListener('click', () => {
        startBtn.classList.add('scale-95');
        setTimeout(() => {
          startBtn.classList.remove('scale-95');
        }, 200);
      });
    }
  })();
</script></main></body></html>
