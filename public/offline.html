<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006b5e" />
    <title>Aksis · Sin conexión</title>
    <style>
      :root { color: #173f37; font-family: Arial, sans-serif; background: #f1fcf7; }
      body { align-items: center; box-sizing: border-box; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
      main { background: rgba(255,255,255,.88); border: 1px solid #d6e8e1; border-radius: 24px; box-shadow: 0 18px 40px rgba(24,91,76,.09); max-width: 330px; padding: 30px 26px; text-align: center; }
      span { align-items: center; background: #e1f5ed; border-radius: 50%; color: #087d6d; display: inline-flex; font-size: 28px; height: 54px; justify-content: center; width: 54px; }
      h1 { font-size: 22px; font-weight: 500; margin: 18px 0 8px; }
      p { color: #58756d; font-size: 14px; line-height: 1.55; margin: 0; }
      button { background: linear-gradient(105deg,#087d6d,#4eaa9b); border: 0; border-radius: 999px; color: white; font-size: 14px; margin-top: 22px; padding: 11px 18px; }
    </style>
  </head>
  <body>
    <main>
      <span>◌</span>
      <h1>Estás sin conexión</h1>
      <p>Aksis protege tus conversaciones y registros: no los guarda para usarlos sin conexión. Cuando vuelvas a conectarte, podés continuar.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
